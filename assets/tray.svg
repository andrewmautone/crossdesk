<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 8 64 48">
  <!-- Menu bar / tray glyph: black on transparent. macOS uses it as a template
       image (tinted for light and dark menu bars); Windows gets a white copy. -->
  <defs>
    <path id="cursor" d="M 30 17 L 30 46 L 37 39.5 L 42 51 L 47.5 48.5 L 42.5 37.5 L 52 37.5 Z"/>
    <!-- Knock a transparent gap around the cursor so it reads apart from the screens. -->
    <mask id="gap">
      <rect width="64" height="64" fill="#FFFFFF"/>
      <use href="#cursor" fill="#000000" stroke="#000000" stroke-width="7" stroke-linejoin="round"/>
    </mask>
  </defs>
  <g mask="url(#gap)">
    <g fill="none" stroke="#000000" stroke-width="4.5" stroke-linejoin="round">
      <rect x="3" y="12" width="25" height="19" rx="3.5"/>
      <rect x="36" y="12" width="25" height="19" rx="3.5"/>
    </g>
    <g fill="#000000">
      <rect x="13" y="31" width="5" height="7"/>
      <rect x="8" y="37" width="15" height="4.5" rx="2.2"/>
      <rect x="46" y="31" width="5" height="7"/>
      <rect x="41" y="37" width="15" height="4.5" rx="2.2"/>
    </g>
  </g>
  <use href="#cursor" fill="#000000" stroke="#000000" stroke-width="1.5" stroke-linejoin="round"/>
</svg>
