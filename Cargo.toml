[package]
name = "crossdesk"
version = "0.1.0"
edition = "2021"
description = "Share one mouse and keyboard between computers on your LAN"
license = "MIT"
build = "build.rs"

[dependencies]
eframe = "0.29"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
spake2 = "0.4"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
hex = "0.4"
directories = "5"
arboard = "3"
gethostname = "0.4"
parking_lot = "0.12"
if-addrs = "0.13"
png = "0.17"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
native-tls = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
tray-icon = "0.19"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = { version = "0.24", features = ["highsierra"] }
core-foundation = "0.10"
foreign-types = "0.5"
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSGeometry"] }

[build-dependencies]
embed-resource = "2.4"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
